<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ — ระบบส่งงานออนไลน์</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">

<!-- Supabase JS Client (v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="icon"><i class="fa-solid fa-key"></i></div>
      <div>
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <span>Assignment Tracker</span>
      </div>
    </div>

    <!-- ============ กำลังตรวจสอบลิงก์ ============ -->
    <div id="checkingState" style="text-align:center;padding:20px 0;color:var(--text-muted);font-size:13.5px;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:22px;display:block;margin-bottom:10px;color:var(--accent);"></i>
      กำลังตรวจสอบลิงก์...
    </div>

    <!-- ============ ลิงก์ไม่ถูกต้อง/หมดอายุ ============ -->
    <div id="invalidLinkState" style="display:none;text-align:center;">
      <div style="font-size:38px;color:var(--danger);margin-bottom:14px;">
        <i class="fa-regular fa-circle-xmark"></i>
      </div>
      <p style="font-size:13.5px;color:var(--text-muted);margin:0 0 20px;">
        ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว กรุณาขอลิงก์ตั้งรหัสผ่านใหม่อีกครั้งจากหน้าเข้าสู่ระบบ
      </p>
      <a href="auth.html" class="btn-primary" style="text-decoration:none;">
        <i class="fa-solid fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ
      </a>
    </div>

    <!-- ============ ฟอร์มตั้งรหัสผ่านใหม่ ============ -->
    <div id="resetFormWrapper" style="display:none;">
      <form id="formResetPassword">
        <div class="field">
          <label>รหัสผ่านใหม่</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="newPassword" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>
          </div>
        </div>
        <div class="field">
          <label>ยืนยันรหัสผ่านใหม่</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="พิมพ์รหัสผ่านอีกครั้ง" minlength="6" required>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="btnResetPassword">
          <i class="fa-solid fa-check"></i> บันทึกรหัสผ่านใหม่
        </button>
      </form>
    </div>

  </div>
</div>

<script>
  /* =====================================================================
     CONFIG — ใส่ค่าเดียวกับที่ใช้ใน auth.html / app.js
     ===================================================================== */
  const SUPABASE_URL = "https://tdceqvzottwnvdxgztol.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkY2VxdnpvdHR3bnZkeGd6dG9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MDIzMzYsImV4cCI6MjA5ODQ3ODMzNn0.psPQn1E-FpLJEKl0figueqTO_3Z4AS6glsT78KYxwQw";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showState(id) {
    ["checkingState", "invalidLinkState", "resetFormWrapper"].forEach((stateId) => {
      document.getElementById(stateId).style.display = stateId === id ? "block" : "none";
    });
  }

  /* ---------------------------------------------------------------------
     รอ Supabase client ประมวลผล recovery token จาก URL (hash/query จากลิงก์
     ในอีเมล) แล้วสร้าง session ชั่วคราวให้ — ตอนสร้างเสร็จจะยิง event
     "PASSWORD_RECOVERY" ถึงจะยอมให้ผู้ใช้ตั้งรหัสผ่านใหม่ได้
     --------------------------------------------------------------------- */
  let recoveryReady = false;

  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoveryReady = true;
      showState("resetFormWrapper");
    }
  });

  (async () => {
    // ให้เวลา client อ่านและประมวลผล URL ก่อนเช็คผล (detectSessionInUrl ทำงาน
    // แบบ async ตอน client เริ่มทำงาน) ถ้าเช็คเร็วเกินไปอาจเจอ false negative
    await new Promise((resolve) => setTimeout(resolve, 400));
    if (recoveryReady) return;

    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      recoveryReady = true;
      showState("resetFormWrapper");
    } else {
      showState("invalidLinkState");
    }
  })();

  /* ---------------------------------------------------------------------
     บันทึกรหัสผ่านใหม่
     --------------------------------------------------------------------- */
  document.getElementById("formResetPassword").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btnResetPassword");
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      Swal.fire({
        icon: "error",
        title: "รหัสผ่านไม่ตรงกัน",
        text: "กรุณากรอกรหัสผ่านทั้งสองช่องให้ตรงกัน",
        confirmButtonColor: "#5b6ee1"
      });
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';

    const { error } = await sb.auth.updateUser({ password: newPassword });

    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> บันทึกรหัสผ่านใหม่';

    if (error) {
      Swal.fire({
        icon: "error",
        title: "บันทึกไม่สำเร็จ",
        text: translateAuthError(error.message),
        confirmButtonColor: "#5b6ee1"
      });
      return;
    }

    // ออกจาก session ชั่วคราวที่ใช้เฉพาะตอน recovery แล้วให้กลับไปล็อกอินใหม่
    // ด้วยรหัสผ่านใหม่ตามปกติ แทนที่จะปล่อยให้ session นี้ค้างอยู่
    await sb.auth.signOut();

    Swal.fire({
      icon: "success",
      title: "ตั้งรหัสผ่านใหม่สำเร็จ",
      text: "กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่",
      confirmButtonColor: "#5b6ee1"
    }).then(() => {
      window.location.href = "auth.html";
    });
  });

  /* ---------------------------------------------------------------------
     แปล error message ที่พบบ่อยจาก Supabase Auth เป็นภาษาไทย
     (เหมือนกับ auth.html — คัดลอกไว้เพราะเป็นหน้าคนละไฟล์ ไม่มี build step
     ให้ import ร่วมกัน)
     --------------------------------------------------------------------- */
  function translateAuthError(msg) {
    const map = {
      "Password should be at least 6 characters": "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",
      "New password should be different from the old password.": "รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม",
      "Auth session missing!": "ลิงก์หมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่อีกครั้ง",
      "Failed to fetch": "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่"
    };
    if (map[msg]) return map[msg];

    if (/rate limit/i.test(msg)) {
      return "ทำรายการถี่เกินไป กรุณารอสักครู่แล้วลองใหม่อีกครั้ง";
    }

    console.warn("Untranslated auth error:", msg);
    return "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
  }
</script>

</body>
</html>
